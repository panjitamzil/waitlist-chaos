services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: waitlist_chaos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d waitlist_chaos"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
